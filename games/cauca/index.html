<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Câu Cá & Phù Phép Sách</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-deep:#1288c9;
    --bg-mid:#29b6f6;
    --bg-light:#5cd0ff;
    --gold:#ffcd3c;
    --gold-dark:#e0a900;
    --panel:#ffffff;
    --panel-light:#fff3cf;
    --text:#111318;
    --text-dim:#4a6274;
    --common:#5b6b76;
    --uncommon:#1f9d5c;
    --rare:#1c7ed6;
    --epic:#8b3fd1;
    --mythic:#e0611f;
    --ink:#111111;
    --nav-h:58px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#4fc3f7 0%, #29b6f6 55%, #1288c9 100%);
    color:var(--text);
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{position:relative; width:100%; height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.5);}

  @media (min-width:701px){
    #app{ max-width:1100px; border-radius:0; box-shadow:none; }
  }

  /* HEADER */
  #header{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:#29b6f6;
    border-bottom:4px solid var(--ink); z-index:20; flex-shrink:0;
  }
  #header .stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px; background:#fff; border:2px solid var(--ink); color:var(--text); padding:5px 9px; border-radius:20px;}
  .back-btn{
    border:2px solid var(--ink); background:#fff; color:var(--text);
    font-size:17px; cursor:pointer; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn:active{transform:scale(0.9);}

  /* MAIN GAME AREA */
  #gameArea{
    position:relative; flex:1; overflow:hidden;
    background:linear-gradient(180deg,#4fc3f7 0%, #1e88c9 45%, #0d5e94 100%);
  }
  .bubble{position:absolute; bottom:-20px; border-radius:50%; background:rgba(255,255,255,.25); animation:rise linear infinite;}
  @keyframes rise{ to{ transform:translateY(-120vh); opacity:0;} }

  #waterLine{position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,#5cd0ff,#29b6f6,#5cd0ff); opacity:.7;}

  #rodArea{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5;
  }
  #rodIcon{font-size:34px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  #line{
    position:absolute; left:50%; top:50px; width:2px; background:rgba(255,255,255,.6);
    transform:translateX(-50%); transition:height .3s;
  }
  #hook{
    position:absolute; left:50%; transform:translateX(-50%); font-size:20px;
    transition:top .4s ease-in-out;
  }

  #catchZone{
    position:absolute; left:50%; top:55%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:14px; z-index:10;
  }
  #fishSilhouette{font-size:60px; animation:wiggle .4s infinite alternate;}
  @keyframes wiggle{ from{transform:rotate(-8deg);} to{transform:rotate(8deg);} }

  #statusText{
    text-align:center; font-size:15px; font-weight:800; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.5); margin-top:6px; min-height:20px;
  }

  #castBtn{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe08a,var(--gold-dark));
    color:#3a2400; border:4px solid var(--ink); border-radius:40px; padding:16px 40px;
    font-size:17px; font-weight:900; box-shadow:0 6px 0 #9e6f00, 0 10px 18px rgba(0,0,0,.4);
    cursor:pointer; z-index:15; letter-spacing:.5px; transition:transform .1s;
  }
  #castBtn:active{transform:translateX(-50%) translateY(4px); box-shadow:0 2px 0 #9e6f00, 0 4px 10px rgba(0,0,0,.4);}

  #comboBar{
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    width:84%; max-width:320px; height:16px; background:rgba(0,0,0,.35);
    border-radius:10px; overflow:hidden; display:none; border:2px solid var(--ink); z-index:16;
  }
  #comboFill{height:100%; width:100%; background:linear-gradient(90deg,#ff3b3b,#c40000); transition:width .2s ease;}

  /* RHYTHM TIMING BAR */
  #rhythmWrap{
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    width:84%; max-width:320px; display:none; z-index:16;
  }
  #rhythmTrack{
    position:relative; width:100%; height:22px; background:rgba(0,0,0,.4);
    border-radius:12px; border:2px solid var(--ink); overflow:hidden;
  }
  #rhythmZone{
    position:absolute; top:0; bottom:0; background:rgba(61,220,132,.5);
    border-left:2px solid var(--uncommon); border-right:2px solid var(--uncommon);
  }
  #rhythmCursor{
    position:absolute; top:-4px; bottom:-4px; width:5px; background:#fff;
    border-radius:3px; box-shadow:0 0 8px rgba(255,255,255,.8); left:0%;
  }

  /* BOTTOM NAV */
  #nav{
    display:flex; background:#fff; border-top:4px solid var(--ink);
    flex-shrink:0; position:relative; z-index:40; height:var(--nav-h);
  }
  .navBtn{
    flex:1; text-align:center; padding:6px 2px; background:none; border:none; color:var(--text-dim);
    font-size:10px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
  }
  .navBtn .navIc{font-size:18px;}
  .navBtn.active{color:var(--gold-dark);}

  /* PANELS */
  .panel{
    position:absolute; top:0; left:0; right:0; bottom:var(--nav-h); background:#eaf6ff; z-index:30;
    display:none; flex-direction:column; overflow:hidden; color:var(--text);
  }
  .panel.show{display:flex;}
  .panelHeader{
    padding:14px 16px 12px; font-size:18px; font-weight:900; border-bottom:4px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:10px;
    background:#29b6f6; color:var(--text);
  }
  .closeBtn{
    background:#fff; border:2px solid var(--ink); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  }
  .panelBody{flex:1; overflow-y:auto; padding:10px 12px 16px;}

  /* CARDS & ITEMS */
  .rodCard, .craftCard{
    background:var(--panel); border-radius:14px; padding:12px; margin-bottom:10px;
    border:3px solid var(--ink); display:flex; gap:12px; align-items:center;
  }
  .rodCard.equipped{border-color:var(--gold-dark); background:var(--panel-light);}
  .rodIcon, .craftIcon{font-size:32px; width:44px; text-align:center;}
  .rodInfo, .craftInfo{flex:1;}
  .rname, .cname{font-weight:800; font-size:14px;}
  .rdesc, .cdesc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .rodBtn, .craftBtn{
    background:var(--gold); color:#3a2400; border:3px solid var(--ink); border-radius:10px; padding:8px 10px;
    font-weight:800; font-size:12px; cursor:pointer; white-space:nowrap;
  }

  .invItem{
    display:flex; align-items:center; gap:8px; background:var(--panel); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; border:3px solid var(--ink);
  }
  .invItem .fic{font-size:28px; width:36px; text-align:center;}
  .invItem .iinfo{flex:1;}
  .invItem .iname{font-weight:700; font-size:13.5px;}
  .invItem .iprice{font-size:11.5px; color:var(--gold-dark);}
  .sellOneBtn{
    background:var(--gold); color:#3a2400; border:3px solid var(--ink); padding:6px 10px; border-radius:10px;
    font-weight:800; font-size:11.5px; cursor:pointer;
  }

  #toastWrap{position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;}
  .toast{background:#fff; border:2px solid var(--ink); color:#111; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700;}

  .enchantBadge{
    display:inline-block; background:#8b3fd1; color:#fff; font-size:10px; padding:2px 6px; border-radius:8px; margin-top:4px; font-weight:800;
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="stat"><span class="ic">👤</span><span id="playerName">Cần thủ</span></div>
    </div>
    <div style="display:flex; gap:6px;">
      <div class="stat"><span class="ic">🪙</span><span id="coinDisplay">0</span></div>
      <div class="stat"><span id="fishCountDisplay">0</span><span class="ic">🔥</span></div>
    </div>
  </div>

  <!-- GAME AREA -->
  <div id="gameArea">
    <div id="waterLine"></div>
    <div id="rodArea"><div id="rodIcon">🎣</div></div>
    <div id="line"></div>
    <div id="hook">🪝</div>

    <div id="catchZone">
      <div id="fishSilhouette" style="display:none;">🐟</div>
      <div id="statusText">Nhấn "Thả câu" để bắt đầu!</div>
    </div>

    <div id="comboBar"><div id="comboFill"></div></div>
    <div id="rhythmWrap">
      <div id="rhythmTrack">
        <div id="rhythmZone"></div>
        <div id="rhythmCursor"></div>
      </div>
    </div>
    <div id="toastWrap"></div>

    <button id="castBtn">🎣 THẢ CÂU</button>
  </div>

  <!-- NAV -->
  <div id="nav">
    <button class="navBtn active" data-panel="game"><span class="navIc">🎣</span>Câu cá</button>
    <button class="navBtn" data-panel="shop"><span class="navIc">🛒</span>Cần câu</button>
    <button class="navBtn" data-panel="craft"><span class="navIc">📚</span>Ráp Sách</button>
    <button class="navBtn" data-panel="enchant"><span class="navIc">✨</span>Phù Phép</button>
    <button class="navBtn" data-panel="inventory"><span class="navIc">🎒</span>Kho đồ</button>
  </div>

  <!-- SHOP PANEL -->
  <div class="panel" id="panel-shop">
    <div class="panelHeader">
      <span>🛒 Cửa Hàng Cần Câu</span>
      <button class="closeBtn" data-close>✕</button>
    </div>
    <div class="panelBody" id="shopList"></div>
  </div>

  <!-- CRAFT PANEL (CỬA HÀNG RÁP SÁCH) -->
  <div class="panel" id="panel-craft">
    <div class="panelHeader">
      <span>📚 Cửa Hàng Ráp Sách</span>
      <button class="closeBtn" data-close>✕</button>
    </div>
    <div class="panelBody" id="craftList"></div>
  </div>

  <!-- ENCHANT PANEL (PHÙ PHÉP CẦN CÂU) -->
  <div class="panel" id="panel-enchant">
    <div class="panelHeader">
      <span>✨ Cửa Hàng Phù Phép</span>
      <button class="closeBtn" data-close>✕</button>
    </div>
    <div class="panelBody" id="enchantList"></div>
  </div>

  <!-- INVENTORY PANEL -->
  <div class="panel" id="panel-inventory">
    <div class="panelHeader">
      <span>🎒 Kho Đồ & Vật Phẩm</span>
      <button class="closeBtn" data-close>✕</button>
    </div>
    <div class="panelBody" id="invList"></div>
  </div>

</div>

<script>
(function(){
"use strict";

/* Sound Engine giả lập */
const SoundEngine = { sfx: new Proxy({}, { get(){ return function(){}; } }) };

/* FIREBASE INIT */
const firebaseConfig = {
  apiKey: "AIzaSyDH_skpX3D9sD3zz3iiyrHnB28BIVvIMM0",
  authDomain: "hihi-c6af6.firebaseapp.com",
  databaseURL: "https://hihi-c6af6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hihi-c6af6",
  storageBucket: "hihi-c6af6.firebasestorage.app",
  messagingSenderId: "164013580789",
  appId: "1:164013580789:web:94227e94c6d517170f40bc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* DANH SÁCH VẬT PHẨM NGUYÊN LIỆU (Tỉ lệ rơi ra khi câu cá) */
const ITEMS = {
  item_thunder: { name: "Lôi Thạch", icon: "⚡" },
  item_fire:    { name: "Hỏa Tinh", icon: "🔥" },
  item_water:   { name: "Thủy Tinh", icon: "💧" },
  item_wind:    { name: "Phong Thạch", icon: "🌪️" },
  item_wood:    { name: "Mộc Căn", icon: "🪵" },
  item_paper:   { name: "Giấy Cổ", icon: "📜" }
};

/* DANH SÁCH SÁCH PHÉP CHẾ TẠO */
const BOOKS = [
  { id: "book_sam",      name: "Sách Sấm",       icon: "⚡📖", req: { item_thunder: 3, item_paper: 2 }, desc: "Phù phép: +50% xu khi bán cá." },
  { id: "book_lua",      name: "Sách Lửa",       icon: "🔥📖", req: { item_fire: 3, item_paper: 2 },    desc: "Phù phép: +25% xu khi bán cá." },
  { id: "book_nuoc",     name: "Sách Nước",      icon: "💧📖", req: { item_water: 3, item_paper: 2 },   desc: "Phù phép: -20% xu khi bán cá." },
  { id: "book_gio",      name: "Sách Gió",       icon: "🌪️📖", req: { item_wind: 3, item_paper: 2 },    desc: "Phù phép: +5% xu khi bán cá." },
  { id: "book_cay",      name: "Sách Cây",       icon: "🪵📖", req: { item_wood: 3, item_paper: 2 },    desc: "Phù phép: -5% xu khi bán cá." },
  { id: "book_baokich",  name: "Sách Bạo Kích",  icon: "💥📖", req: { item_fire: 2, item_thunder: 2, item_paper: 3 }, desc: "Phù phép: Có tỉ lệ giảm 2 cục máu cá khi bấm." },
  { id: "book_tocdo",    name: "Sách Tốc Độ",    icon: "⚡📖", req: { item_wind: 2, item_thunder: 2, item_paper: 3 }, desc: "Phù phép: Giảm thời gian chờ cá cắn câu." },
  { id: "book_chinhxac", name: "Sách Chính Xác",icon: "🎯📖", req: { item_wood: 2, item_water: 2, item_paper: 3 },   desc: "Phù phép: Tăng tỉ lệ câu thành công (rộng vùng xanh)." },
  { id: "book_nhandoi",  name: "Sách Nhân Đôi",  icon: "✨📖", req: { item_thunder: 2, item_paper: 5 }, desc: "Phù phép: Có tỉ lệ gấp đôi vật phẩm hoặc cá." },
  { id: "book_vang",     name: "Sách Vàng",      icon: "🪙📖", req: { item_fire: 2, item_wood: 2, item_paper: 4 },    desc: "Phù phép: % ngẫu nhiên tăng thêm xu khi bán cá." },
  { id: "book_banggia",  name: "Sách Băng Giá",  icon: "❄️📖", req: { item_water: 4, item_paper: 3 },  desc: "Phù phép: Làm chậm cá khi kéo." }
];

/* DANH SÁCH CÁ */
const FISH_LIST = [
  { id: 1, name: "Cá Chép", price: 30, icon: "🐟" },
  { id: 2, name: "Cá Rô Phi", price: 20, icon: "🐟" },
  { id: 3, name: "Cá Hồi", price: 150, icon: "🐠" },
  { id: 4, name: "Cá Ngừ", price: 500, icon: "🐡" },
  { id: 5, name: "Cá Mập", price: 3000, icon: "🦈" }
];

/* DANH SÁCH CẦN CÂU */
const RODS = [
  { id: "tre", name: "Cần Tre Tân Thủ", icon: "🎋", price: 0 },
  { id: "carbon", name: "Cần Carbon", icon: "⚙️", price: 1000 },
  { id: "poseidon", name: "Cần Poseidon", icon: "🔱", price: 10000 }
];

/* STATE GAME */
const SAVE_KEY = "fishingWorld_save_v2";
let state = {
  coins: 100,
  ownedRods: ["tre"],
  equippedRod: "tre",
  rodEnchants: {}, // rodId -> bookId (Lưu sách đã phù phép vào từng cần câu)
  inventory: {},   // fishId -> count
  items: {},       // itemId -> count
  books: {},       // bookId -> count
  catchStreak: 0
};

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
  updateHeader();
}

function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
  updateHeader();
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  toastWrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2000);
}

function updateHeader(){
  document.getElementById('coinDisplay').textContent = state.coins.toLocaleString('vi-VN');
  document.getElementById('fishCountDisplay').textContent = state.catchStreak;
}

/* HIỂN THỊ CỬA HÀNG CẦN CÂU */
function renderShop(){
  const wrap = document.getElementById('shopList');
  wrap.innerHTML = '';
  RODS.forEach(r=>{
    const owned = state.ownedRods.includes(r.id);
    const equipped = state.equippedRod === r.id;
    const enchantBook = state.rodEnchants[r.id] ? BOOKS.find(b=>b.id===state.rodEnchants[r.id]) : null;

    const div = document.createElement('div');
    div.className = 'rodCard' + (equipped ? ' equipped' : '');
    div.innerHTML = `
      <div class="rodIcon">${r.icon}</div>
      <div class="rodInfo">
        <div class="rname">${r.name}</div>
        <div class="rdesc">Giá: ${r.price} Xu</div>
        ${enchantBook ? `<div class="enchantBadge">✨ Phù phép: ${enchantBook.name}</div>` : ''}
      </div>
      <button class="rodBtn">${equipped ? 'Đang dùng' : owned ? 'Trang bị' : 'Mua'}</button>
    `;
    div.querySelector('button').onclick = ()=>{
      if(!owned){
        if(state.coins >= r.price){
          state.coins -= r.price;
          state.ownedRods.push(r.id);
          state.equippedRod = r.id;
          saveState();
          renderShop();
          toast("Đã mua " + r.name);
        }else toast("Không đủ tiền!");
      }else{
        state.equippedRod = r.id;
        saveState();
        renderShop();
      }
    };
    wrap.appendChild(div);
  });
}

/* HIỂN THỊ CỬA HÀNG RÁP SÁCH */
function renderCraft(){
  const wrap = document.getElementById('craftList');
  wrap.innerHTML = '';
  BOOKS.forEach(b=>{
    let reqText = [];
    let canCraft = true;
    for(let itemId in b.req){
      const count = state.items[itemId] || 0;
      const need = b.req[itemId];
      if(count < need) canCraft = false;
      reqText.push(`${ITEMS[itemId].icon}${ITEMS[itemId].name}: ${count}/${need}`);
    }

    const div = document.createElement('div');
    div.className = 'craftCard';
    div.innerHTML = `
      <div class="craftIcon">${b.icon}</div>
      <div class="craftInfo">
        <div class="cname">${b.name} (Có: ${state.books[b.id]||0})</div>
        <div class="cdesc">${b.desc}</div>
        <div class="cdesc" style="color:var(--text); font-weight:700;">${reqText.join(" | ")}</div>
      </div>
      <button class="craftBtn" ${canCraft?'':'style="opacity:0.5"'}>Chế tạo</button>
    `;
    div.querySelector('button').onclick = ()=>{
      if(!canCraft){ toast("Không đủ nguyên liệu!"); return; }
      for(let itemId in b.req){
        state.items[itemId] -= b.req[itemId];
      }
      state.books[b.id] = (state.books[b.id]||0) + 1;
      saveState();
      renderCraft();
      toast("Chế tạo thành công " + b.name);
    };
    wrap.appendChild(div);
  });
}

/* HIỂN THỊ CỬA HÀNG PHÙ PHÉP CẦN CÂU */
function renderEnchant(){
  const wrap = document.getElementById('enchantList');
  wrap.innerHTML = '<h4 style="margin:5px 0;">Chọn sách để phù phép cho Cần đang trang bị:</h4>';

  const equippedRod = RODS.find(r=>r.id===state.equippedRod);
  const currentEnchant = state.rodEnchants[equippedRod.id];

  const currentInfo = document.createElement('div');
  currentInfo.style.marginBottom = "10px";
  currentInfo.innerHTML = `Cần hiện tại: <b>${equippedRod.name}</b> | Phù phép: <b>${currentEnchant ? BOOKS.find(b=>b.id===currentEnchant).name : 'Chưa có'}</b>`;
  wrap.appendChild(currentInfo);

  BOOKS.forEach(b=>{
    const count = state.books[b.id] || 0;
    const div = document.createElement('div');
    div.className = 'craftCard';
    div.innerHTML = `
      <div class="craftIcon">${b.icon}</div>
      <div class="craftInfo">
        <div class="cname">${b.name} (Còn: ${count})</div>
        <div class="cdesc">${b.desc}</div>
      </div>
      <button class="craftBtn" ${count>0?'':'style="opacity:0.5"'}>Khảm Sách</button>
    `;
    div.querySelector('button').onclick = ()=>{
      if(count <= 0){ toast("Bạn không có sách này!"); return; }
      state.books[b.id]--;
      state.rodEnchants[equippedRod.id] = b.id;
      saveState();
      renderEnchant();
      renderShop();
      toast(`Đã phù phép ${b.name} vào ${equippedRod.name}!`);
    };
    wrap.appendChild(div);
  });
}

/* HIỂN THỊ KHO ĐỒ & BÁN CÁ */
function renderInventory(){
  const wrap = document.getElementById('invList');
  wrap.innerHTML = '<h4 style="margin:5px 0;">Vật Phẩm Nguyên Liệu:</h4>';

  /* 1. Vật phẩm nguyên liệu */
  let itemContainer = document.createElement('div');
  itemContainer.style.display = "flex";
  itemContainer.style.gap = "10px";
  itemContainer.style.flexWrap = "wrap";
  itemContainer.style.marginBottom = "15px";

  for(let itemId in ITEMS){
    const count = state.items[itemId] || 0;
    const div = document.createElement('div');
    div.style.background = "#fff";
    div.style.border = "2px solid #111";
    div.style.padding = "6px 10px";
    div.style.borderRadius = "8px";
    div.style.fontSize = "12px";
    div.innerHTML = `${ITEMS[itemId].icon} ${ITEMS[itemId].name}: <b>${count}</b>`;
    itemContainer.appendChild(div);
  }
  wrap.appendChild(itemContainer);

  /* 2. Cá bắt được */
  wrap.appendChild(document.createElement('hr'));
  const fishTitle = document.createElement('h4');
  fishTitle.style.margin = "5px 0";
  fishTitle.textContent = "Cá Trong Kho:";
  wrap.appendChild(fishTitle);

  const equippedEnchant = state.rodEnchants[state.equippedRod];

  FISH_LIST.forEach(f=>{
    const count = state.inventory[f.id] || 0;
    if(count <= 0) return;

    /* TÍNH BÁN CÁ THEO PHÙ PHÉP DÒNG SẤM, LỬA, NƯỚC, GIÓ, CÂY, SÁCH VÀNG */
    let priceMultiplier = 1.0;
    if(equippedEnchant === 'book_sam') priceMultiplier += 0.50;      // +50% xu
    if(equippedEnchant === 'book_lua') priceMultiplier += 0.25;      // +25% xu
    if(equippedEnchant === 'book_nuoc') priceMultiplier -= 0.20;     // -20% xu
    if(equippedEnchant === 'book_gio') priceMultiplier += 0.05;      // +5% xu
    if(equippedEnchant === 'book_cay') priceMultiplier -= 0.05;      // -5% xu

    let finalPrice = Math.max(1, Math.round(f.price * priceMultiplier));

    const div = document.createElement('div');
    div.className = 'invItem';
    div.innerHTML = `
      <div class="fic">${f.icon}</div>
      <div class="iinfo">
        <div class="iname">${f.name} (x${count})</div>
        <div class="iprice">Giá bán: ${finalPrice} Xu/con</div>
      </div>
      <button class="sellOneBtn">Bán 1 con</button>
    `;
    div.querySelector('button').onclick = ()=>{
      state.inventory[f.id]--;

      /* Xử lý Sách Vàng (tỉ lệ % ngẫu nhiên cộng thêm xu) */
      let bonusCoin = 0;
      if(equippedEnchant === 'book_vang'){
        const randomPercent = Math.floor(Math.random() * 50) + 1; // 1% đến 50%
        bonusCoin = Math.round(finalPrice * (randomPercent / 100));
      }

      const totalGain = finalPrice + bonusCoin;
      state.coins += totalGain;
      saveState();
      renderInventory();
      toast(`Đã bán 1 ${f.name} nhận ${totalGain} Xu!${bonusCoin>0?` (Thưởng Sách Vàng +${bonusCoin})`:''}`);
    };
    wrap.appendChild(div);
  });
}

/* LOGIC CÂU CÁ */
let isFishing = false;
let fishHealth = 100;
let rhythmPos = 0;
let rhythmDir = 1;
let rhythmInterval = null;

const castBtn = document.getElementById('castBtn');

castBtn.onclick = ()=>{
  if(isFishing) return;
  isFishing = true;
  castBtn.disabled = true;
  statusText.textContent = "Đang thả câu...";

  const equippedEnchant = state.rodEnchants[state.equippedRod];

  /* Sách Tốc Độ: Giảm thời gian chờ cá cắn câu */
  let waitTime = 2000 + Math.random() * 2000;
  if(equippedEnchant === 'book_tocdo'){
    waitTime = waitTime * 0.5; // Giảm 50% thời gian chờ
  }

  setTimeout(()=>{
    statusText.textContent = "CÁ CẮN CÂU! NHẤP NGAY!";
    fishSilhouette.style.display = "block";
    comboBar.style.display = "block";
    rhythmWrap.style.display = "block";
    startRhythmGame();
  }, waitTime);
};

function startRhythmGame(){
  fishHealth = 100;
  updateFishHealthBar();

  const equippedEnchant = state.rodEnchants[state.equippedRod];

  /* Sách Băng Giá: Làm chậm cá khi kéo */
  let speed = 2;
  if(equippedEnchant === 'book_banggia'){
    speed = 1; 
  }

  /* Sách Chính Xác: Tăng tỉ lệ thành công (rộng vùng xanh) */
  if(equippedEnchant === 'book_chinhxac'){
    rhythmZone.style.width = "40%";
    rhythmZone.style.left = "30%";
  }else{
    rhythmZone.style.width = "25%";
    rhythmZone.style.left = "37.5%";
  }

  rhythmInterval = setInterval(()=>{
    rhythmPos += speed * rhythmDir;
    if(rhythmPos >= 100 || rhythmPos <= 0) rhythmDir *= -1;
    rhythmCursor.style.left = rhythmPos + "%";
  }, 15);

  gameArea.onclick = onFishClick;
}

function onFishClick(e){
  if(e.target.id === 'nav' || e.target.closest('#nav') || e.target.closest('.panel')) return;
  if(!isFishing || rhythmWrap.style.display !== "block") return;

  const equippedEnchant = state.rodEnchants[state.equippedRod];

  // Kiểm tra con trỏ có ở vùng xanh không (37.5% -> 62.5% hoặc rộng hơn nếu dùng Sách Chính Xác)
  const minZone = equippedEnchant === 'book_chinhxac' ? 30 : 37.5;
  const maxZone = equippedEnchant === 'book_chinhxac' ? 70 : 62.5;

  if(rhythmPos >= minZone && rhythmPos <= maxZone){
    /* Sách Bạo Kích: Giảm 2 cục máu cá (gấp đôi sát thương) */
    let damage = 25;
    if(equippedEnchant === 'book_baokich' && Math.random() < 0.5){
      damage = 50; 
      toast("💥 Sách Bạo Kích gây sát thương gấp đôi!");
    }

    fishHealth -= damage;
    updateFishHealthBar();

    if(fishHealth <= 0){
      winFishing();
    }
  }
}

function updateFishHealthBar(){
  comboFill.style.width = fishHealth + "%";
}

function winFishing(){
  clearInterval(rhythmInterval);
  gameArea.onclick = null;

  comboBar.style.display = "none";
  rhythmWrap.style.display = "none";
  fishSilhouette.style.display = "none";

  const caughtFish = FISH_LIST[Math.floor(Math.random() * FISH_LIST.length)];
  const equippedEnchant = state.rodEnchants[state.equippedRod];

  /* Sách Nhân Đôi: Tỉ lệ gấp đôi vật phẩm hoặc cá */
  let multiplier = 1;
  if(equippedEnchant === 'book_nhandoi' && Math.random() < 0.4){
    multiplier = 2;
    toast("✨ Sách Nhân Đôi kích hoạt! x2 Phần thưởng!");
  }

  state.inventory[caughtFish.id] = (state.inventory[caughtFish.id] || 0) + (1 * multiplier);
  state.catchStreak++;

  /* TỈ LỆ RƠI RA VẬT PHẨM (40% cơ hội)[cite: 1] */
  let dropMsg = "";
  if(Math.random() < 0.40){
    const itemKeys = Object.keys(ITEMS);
    const randomItemKey = itemKeys[Math.floor(Math.random() * itemKeys.length)];
    const dropQty = 1 * multiplier;
    state.items[randomItemKey] = (state.items[randomItemKey] || 0) + dropQty;
    dropMsg = ` & rơi ra x${dropQty} ${ITEMS[randomItemKey].icon}${ITEMS[randomItemKey].name}!`;
  }

  statusText.textContent = `Bạn nhận được x${multiplier} ${caughtFish.name}${dropMsg}`;
  toast(`Bắt thành công ${caughtFish.name}!`);

  saveState();
  isFishing = false;
  castBtn.disabled = false;
}

/* CHUYỂN TAB PANEL */
document.querySelectorAll('.navBtn').forEach(btn=>{
  btn.onclick = ()=>{
    const panelId = btn.getAttribute('data-panel');
    document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));

    btn.classList.add('active');
    if(panelId !== 'game'){
      const targetPanel = document.getElementById('panel-' + panelId);
      if(targetPanel) targetPanel.classList.add('show');
    }

    if(panelId === 'shop') renderShop();
    if(panelId === 'craft') renderCraft();
    if(panelId === 'enchant') renderEnchant();
    if(panelId === 'inventory') renderInventory();
  };
});

document.querySelectorAll('.closeBtn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.navBtn[data-panel="game"]').classList.add('active');
  };
});

window.goBack = function(){
  alert("Trở về màn hình chính!");
};

loadState();
})();
</script>
