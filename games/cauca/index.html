<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Câu Cá</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-deep:#1288c9;
    --bg-mid:#29b6f6;
    --bg-light:#5cd0ff;
    --gold:#ffcd3c;
    --gold-dark:#e0a900;
    --panel:#ffffff;
    --panel-light:#fff3cf;
    --text:#111318;
    --text-dim:#4a6274;
    --common:#5b6b76;
    --uncommon:#1f9d5c;
    --rare:#1c7ed6;
    --epic:#8b3fd1;
    --mythic:#e0611f;
    --ink:#111111;
    --nav-h:58px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#4fc3f7 0%, #29b6f6 55%, #1288c9 100%);
    color:var(--text);
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{position:relative; width:100%; height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.5);}

  /* DESKTOP */
  @media (min-width:701px){
    #app{
      max-width:1100px;
      border-radius:0;
      box-shadow:none;
    }
  }

  /* HEADER */
  #header{
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:#29b6f6;
    border-bottom:4px solid var(--ink); z-index:20; flex-shrink:0;
  }
  #headerMidGroup{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    display:flex; gap:6px; z-index:21;
  }
  #headerMidGroup .stat{ padding:6px 8px; }
  #headerMidGroup .stat .ic{font-size:16px;}
  #header .stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px; background:#fff; border:2px solid var(--ink); color:var(--text); padding:5px 9px; border-radius:20px;}
  #soundToggleBtn{border:2px solid var(--ink); background:#fff; color:var(--text); font-size:15px; padding:5px 9px; line-height:1; border-radius:50%;}
  #header .stat .ic{font-size:15px;}
  #playerName{font-size:12px; color:#06283d; font-weight:800;}

  /* ACCOUNT BUTTON */
  #accountBtn{
    display:flex; align-items:center; gap:6px; background:#fff;
    border:2px solid var(--ink); border-radius:20px; padding:5px 10px 5px 5px;
    color:var(--text); font-size:11.5px; font-weight:800;
  }
  #accountBtn .avatarIc{
    width:24px; height:24px; border-radius:50%; background:var(--gold); color:#3a2400;
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
    overflow:hidden; border:2px solid var(--ink);
  }
  #accountBtn.loggedIn .avatarIc{background:var(--uncommon); color:#04351f;}

  /* BACK BUTTON */
  .back-btn{
    border:2px solid var(--ink); background:#fff; color:var(--text);
    font-size:17px; cursor:pointer; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn:active{transform:scale(0.9);}

  #accountPanelBody{padding-top:6px;}
  .accInfoRow{display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid rgba(0,0,0,.1); font-size:13.5px;}
  .accInfoRow span:first-child{color:var(--text-dim);}

  /* AVATAR PICKER */
  #accAvatarBig{
    width:72px; height:72px; border-radius:50%; background:var(--gold); color:#3a2400; font-size:32px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 8px; position:relative;
    border:3px solid var(--ink); overflow:hidden; padding:0; box-sizing:border-box; -webkit-appearance:none; appearance:none;
  }
  #accAvatarBig img{display:block;}
  .nameRow{display:flex; align-items:center; justify-content:center; gap:6px;}
  .nameEditBtn{
    background:#fff; border:2px solid var(--ink); color:var(--text-dim); font-size:12px;
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .nameEditRow{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px;}
  .nameEditRow input{
    background:#fff; border:2px solid var(--ink); border-radius:8px; color:var(--text);
    padding:7px 10px; font-size:13.5px; width:150px; text-align:center;
  }
  .nameEditRow button{
    border:2px solid var(--ink); border-radius:8px; padding:7px 10px; font-weight:800; font-size:12.5px;
  }
  .nameEditRow .nameSaveBtn{background:var(--gold); color:#3a2400;}
  .nameEditRow .nameCancelBtn{background:#eef3f6; color:var(--text);}
  #accAvatarBig .editBadge{
    position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%;
    background:#fff; border:2px solid var(--ink); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .uploadAvatarBtn{
    display:block; background:linear-gradient(180deg,#ffe08a,var(--gold-dark)); color:#3a2400; border:3px solid var(--ink);
    border-radius:12px; padding:12px; font-weight:800; font-size:13px; box-shadow:0 4px 0 #9e6f00;
  }

  /* MAIN GAME AREA */
  #gameArea{
    position:relative; flex:1; overflow:hidden;
    background:linear-gradient(180deg,#4fc3f7 0%, #1e88c9 45%, #0d5e94 100%);
  }
  .bubble{position:absolute; bottom:-20px; border-radius:50%; background:rgba(255,255,255,.25); animation:rise linear infinite;}
  @keyframes rise{ to{ transform:translateY(-120vh); opacity:0;} }

  #waterLine{position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg,#5cd0ff,#29b6f6,#5cd0ff); opacity:.7;}

  #rodArea{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5;
  }
  #rodIcon{font-size:34px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  #line{
    position:absolute; left:50%; top:50px; width:2px; background:rgba(255,255,255,.6);
    transform:translateX(-50%); transition:height .3s;
  }
  #hook{
    position:absolute; left:50%; transform:translateX(-50%); font-size:20px;
    transition:top .4s ease-in-out;
  }

  #catchZone{
    position:absolute; left:50%; top:55%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:14px; z-index:10;
  }
  #fishSilhouette{font-size:60px; animation:wiggle .4s infinite alternate;}
  @keyframes wiggle{ from{transform:rotate(-8deg);} to{transform:rotate(8deg);} }

  #statusText{
    text-align:center; font-size:15px; font-weight:800; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.5); margin-top:6px; min-height:20px;
  }

  #castBtn{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe08a,var(--gold-dark));
    color:#3a2400; border:4px solid var(--ink); border-radius:40px; padding:16px 40px;
    font-size:17px; font-weight:900; box-shadow:0 6px 0 #9e6f00, 0 10px 18px rgba(0,0,0,.4);
    cursor:pointer; z-index:15; letter-spacing:.5px;
    transition:transform .1s;
  }
  #castBtn:active{transform:translateX(-50%) translateY(4px); box-shadow:0 2px 0 #9e6f00, 0 4px 10px rgba(0,0,0,.4);}
  #castBtn.pulled{animation:pulse .5s infinite;}
  @keyframes pulse{ 0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.08);} }
  #castBtn:disabled{opacity:.5; cursor:default;}

  #fishHealthLabel{ display:none; }
  #comboBar{
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    width:84%; max-width:320px; height:16px; background:rgba(0,0,0,.35);
    border-radius:10px; overflow:hidden; display:none; border:2px solid var(--ink); z-index:16;
  }
  #comboFill{height:100%; width:100%; background:linear-gradient(90deg,#ff3b3b,#c40000); transition:width .2s ease;}

  /* RHYTHM TIMING BAR */
  #rhythmWrap{
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    width:84%; max-width:320px; display:none; z-index:16;
  }
  #rhythmTrack{
    position:relative; width:100%; height:22px; background:rgba(0,0,0,.4);
    border-radius:12px; border:2px solid var(--ink); overflow:hidden;
  }
  #rhythmZone{
    position:absolute; top:0; bottom:0; background:rgba(61,220,132,.5);
    border-left:2px solid var(--uncommon); border-right:2px solid var(--uncommon);
  }
  #rhythmCursor{
    position:absolute; top:-4px; bottom:-4px; width:5px; background:#fff;
    border-radius:3px; box-shadow:0 0 8px rgba(255,255,255,.8);
    left:0%;
  }
  #rhythmHint{ display:none; }
  .missFlash{animation:missFlash .3s;}
  @keyframes missFlash{ 0%,100%{filter:none;} 50%{filter:brightness(2) hue-rotate(-40deg);} }

  /* FLOATING CATCH TOAST */
  .catchPopup{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) scale(.5);
    background:#fff; border:4px solid var(--ink); border-radius:18px;
    padding:20px 26px; text-align:center; z-index:100; opacity:0; color:var(--text);
    box-shadow:0 10px 40px rgba(0,0,0,.4);
    animation:popIn .4s forwards;
  }
  @keyframes popIn{ to{ transform:translate(-50%,-50%) scale(1); opacity:1;} }
  .catchPopup .cfish{font-size:54px;}
  .catchPopup .cname{font-size:19px; font-weight:800; margin-top:4px;}
  .catchPopup .crarity{font-size:12px; font-weight:700; margin-top:2px; padding:3px 10px; border-radius:12px; display:inline-block;}
  .catchPopup .cweight{font-size:13px; color:var(--text-dim); margin-top:6px;}
  .catchPopup .ccoin{font-size:15px; color:var(--gold-dark); font-weight:800; margin-top:4px;}
  .catchPopup .cclose{margin-top:14px; background:var(--gold); border:3px solid var(--ink); padding:9px 24px; border-radius:20px; font-weight:800; color:#3a2400;}

  /* BOTTOM NAV */
  #nav{
    display:flex; background:#fff; border-top:4px solid var(--ink);
    flex-shrink:0; position:relative; z-index:40; height:var(--nav-h);
  }
  .navBtn{
    flex:1; text-align:center; padding:9px 2px 8px; background:none; border:none; color:var(--text-dim);
    font-size:11px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px;
    cursor:pointer; position:relative;
  }
  .navBtn .navIc{font-size:20px;}
  .navBtn.active{color:var(--gold-dark);}

  /* PANELS */
  .panel{
    position:absolute; top:0; left:0; right:0; bottom:var(--nav-h); background:#eaf6ff; z-index:30;
    display:none; flex-direction:column; overflow:hidden; color:var(--text);
  }
  .panel.show{display:flex;}
  .panelHeader{
    padding:14px 16px 12px; font-size:18px; font-weight:900; border-bottom:4px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:10px;
    background:#29b6f6; color:var(--text);
  }
  .panelHeader .phTitle{flex:1; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .closeBtn{
    background:#fff; border:2px solid var(--ink); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; line-height:1;
    cursor:pointer;
  }
  .closeBtn:active{background:#eee;}
  .panelBody{flex:1; overflow-y:auto; padding:10px 12px 16px;}

  /* WORLD CHAT HEADER */
  #wcBrand{display:flex; align-items:center; gap:8px; flex:1;}
  #wcChatIcon{
    width:34px; height:34px; border-radius:50% 50% 50% 4px; background:#fff; color:#111;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  #wcChatIcon svg{width:19px; height:19px; display:block;}
  #wcChatText{
    font-weight:900; font-size:20px; color:#111; letter-spacing:.3px;
    font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif; text-transform:lowercase;
  }
  #btnGoArena{
    background:#ffcd3c; color:#1a1200; font-weight:900; font-size:14px;
    border:3px solid #111; border-radius:16px; padding:9px 16px;
    box-shadow:0 3px 0 #a5720a; cursor:pointer; flex-shrink:0; white-space:nowrap;
  }
  #btnGoArena:active{transform:translateY(2px); box-shadow:0 1px 0 #a5720a;}

  /* SHOP */
  .rodCard{
    background:var(--panel); border-radius:14px; padding:14px; margin-bottom:10px;
    border:3px solid var(--ink); display:flex; gap:12px; align-items:center;
  }
  .rodCard.owned{border-color:var(--uncommon);}
  .rodCard.equipped{border-color:var(--gold-dark); background:var(--panel-light);}
  .rodIcon{font-size:34px; width:44px; text-align:center;}
  .rodInfo{flex:1;}
  .rodInfo .rname{font-weight:800; font-size:14.5px;}
  .rodInfo .rdesc{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .rodInfo .rdur{font-size:11.5px; color:var(--gold-dark); margin-top:3px; font-weight:700;}
  .rodBtn{
    background:var(--gold); color:#3a2400; border:3px solid var(--ink); border-radius:10px; padding:9px 12px;
    font-weight:800; font-size:12.5px; white-space:nowrap; cursor:pointer;
  }
  .rodBtn.disabled{background:#e3e9ec; color:#8a99a3; border-color:rgba(0,0,0,.15); cursor:default;}
  .rodBtn.equippedBtn{background:var(--uncommon); color:#04351f;}

  /* MATERIALS / BOOK CRAFT SHOP */
  .matBar{
    display:flex; gap:8px; flex-wrap:wrap; background:var(--panel); border:3px solid var(--ink);
    border-radius:14px; padding:10px 12px; margin-bottom:12px;
  }
  .matChip{
    display:flex; align-items:center; gap:5px; background:var(--panel-light); border:2px solid var(--ink);
    border-radius:20px; padding:5px 10px; font-size:12.5px; font-weight:800; color:var(--text);
  }
  .matChip .mic{font-size:15px;}
  .bookCard{
    background:var(--panel); border-radius:14px; padding:14px; margin-bottom:10px;
    border:3px solid var(--ink); display:flex; gap:12px; align-items:center;
  }
  .bookCard.owned{border-color:var(--uncommon);}
  .bookCard.equipped{border-color:var(--gold-dark); background:var(--panel-light);}
  .bookIcon{font-size:30px; width:44px; text-align:center; flex-shrink:0;}
  .bookInfo{flex:1; min-width:0;}
  .bookInfo .bname{font-weight:800; font-size:14.5px;}
  .bookInfo .bdesc{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .bookInfo .bcost{font-size:11.5px; color:var(--gold-dark); margin-top:3px; font-weight:700;}
  .bookInfo .bcost span.have{color:var(--uncommon);}
  .bookInfo .bcost span.short{color:#c40000;}
  .bookBtn{
    background:var(--gold); color:#3a2400; border:3px solid var(--ink); border-radius:10px; padding:9px 12px;
    font-weight:800; font-size:12px; white-space:nowrap; flex-shrink:0; cursor:pointer;
  }
  .bookBtn.disabled{background:#e3e9ec; color:#8a99a3; border-color:rgba(0,0,0,.15); cursor:default;}
  .bookBtn.equippedBtn{background:var(--uncommon); color:#04351f;}
  .bookBtn.lockedBtn{background:#e3e9ec; color:#8a99a3; border-color:rgba(0,0,0,.15); cursor:default;}
  .enchantSlotsInfo{
    text-align:center; font-size:12.5px; font-weight:800; color:var(--text-dim);
    margin-bottom:10px; background:var(--panel); border:2px solid var(--ink); border-radius:10px; padding:8px;
  }

  /* COLLECTION */
  .collectionHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px;}
  .collectionHead .cprog{font-size:13px; font-weight:800; color:var(--gold-dark);}
  .fishGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .fishCell{
    background:var(--panel); border-radius:12px; padding:8px 4px; text-align:center;
    border:2px solid var(--ink); position:relative;
  }
  .fishCell.locked{opacity:.4;}
  .fishCell .fic{font-size:26px;}
  .fishCell .fnm{font-size:9.5px; font-weight:700; margin-top:2px; line-height:1.2; min-height:22px;}
  .fishCell .fcount{position:absolute; top:2px; right:4px; font-size:9px; color:var(--gold-dark); font-weight:800;}

  /* INVENTORY */
  .invItem{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; border:3px solid var(--ink);
  }
  .invItem .fic{font-size:28px; width:36px; text-align:center; flex-shrink:0;}
  .invItem .iinfo{flex:1; min-width:0;}
  .invItem .iname{font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .invItem .iprice{font-size:11.5px; color:var(--gold-dark); margin-top:1px;}
  .invItem .iqty{margin-left:auto; font-weight:800; color:var(--text-dim); font-size:13px; flex-shrink:0;}
  .invItem .sellOneBtn{
    background:var(--gold); color:#3a2400; border:3px solid var(--ink); padding:8px 12px; border-radius:10px;
    font-weight:800; font-size:11.5px; white-space:nowrap; margin-left:8px; flex-shrink:0; cursor:pointer;
  }
  .sellAllBtn{
    position:sticky; bottom:0; width:100%; background:linear-gradient(180deg,#ffe08a,var(--gold-dark));
    color:#3a2400; border:4px solid var(--ink); padding:14px; border-radius:14px; font-weight:800; font-size:15px;
    margin-top:8px; box-shadow:0 6px 0 #9e6f00; cursor:pointer;
  }

  /* CHAT */
  #chatMessages{flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; background:#29b6f6;}
  .msg{display:flex; gap:8px; align-items:flex-start; max-width:85%;}
  .msg .av{font-size:20px; flex-shrink:0; width:38px; height:38px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#fff; border:3px solid #111; cursor:pointer;}
  .msg .av img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
  .msg .bubble2{background:#fff; color:#111; border:3px solid #111; border-radius:16px 16px 16px 4px; padding:9px 13px; font-size:13.5px; font-weight:600; word-break:break-word; overflow-wrap:anywhere;}
  .roomInviteCard{
    background:#fff; border:3px solid var(--ink); border-radius:14px; padding:10px 12px; min-width:190px;
  }
  .roomInviteCard .ricTitle{font-size:12.5px; font-weight:800; color:var(--gold-dark); display:flex; align-items:center; gap:6px;}
  .roomInviteCard .ricBet{font-size:12px; color:var(--text-dim); margin:4px 0 8px;}
  .roomInviteCard .ricJoinBtn{
    width:100%; border:3px solid var(--ink); border-radius:10px; padding:8px; font-weight:800; font-size:12.5px;
    background:linear-gradient(180deg,#ffe08a,var(--gold-dark)); color:#3a2400; cursor:pointer;
  }
  .roomInviteCard .ricJoinBtn:disabled{opacity:.5; cursor:default;}
  .msg .name{font-size:11.5px; color:#fff; font-weight:800; margin-bottom:3px; text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .msg .msgTime{font-size:10px; color:#fff; opacity:.8; margin-top:2px; text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .msg.me .msgTime{text-align:right;}
  .msg.me .name{text-align:right;}
  .msg.me{align-self:flex-end; flex-direction:row-reverse;}
  .msg.me .bubble2{background:#ffcd3c; color:#1a1200; border:3px solid #111; border-radius:16px 16px 4px 16px;}
  .msg.sys{align-self:center; max-width:95%;}
  .msg.sys .bubble2{background:#fff8e1; border:2px solid var(--gold-dark); color:#7a5600; font-weight:700; text-align:center; font-size:12.5px;}
  .msg.sys.noitu .bubble2{background:#e7f6ff; border:2px solid #1288c9; color:#0b4f75;}
  .msg.sys.noituWin .bubble2{background:#fff3cf; border:2px solid var(--gold-dark); color:#7a5600;}
  #chatInputBar{display:flex; gap:8px; padding:10px 12px 12px; border-top:5px solid #000; background:#29b6f6; flex-shrink:0;}
  #chatInputBar input{
    flex:1; background:#fff; border:3px solid #111; border-radius:20px;
    padding:10px 16px; color:#111; font-size:14px; font-weight:600; outline:none;
  }
  #chatInputBar input::placeholder{color:#888;}
  #chatInputBar input:disabled{background:#eee; color:#999; cursor:not-allowed;}
  #chatInputBar button:disabled{opacity:.5; cursor:not-allowed;}
  #chatInputBar button{
    background:#ffcd3c; color:#1a1200; border:3px solid #111; border-radius:50%; width:44px; height:44px;
    font-size:18px; flex-shrink:0; box-shadow:0 3px 0 #a5720a; cursor:pointer;
  }
  #chatInputBar button:active{transform:translateY(2px); box-shadow:0 1px 0 #a5720a;}

  .rarityTag{font-weight:800;}
  .r-common{color:var(--common);}
  .r-uncommon{color:var(--uncommon);}
  .r-rare{color:var(--rare);}
  .r-epic{color:var(--epic);}
  .r-mythic{color:var(--mythic);}
  .bg-common{background:rgba(91,107,118,.15); color:var(--common);}
  .bg-uncommon{background:rgba(31,157,92,.15); color:var(--uncommon);}
  .bg-rare{background:rgba(28,126,214,.15); color:var(--rare);}
  .bg-epic{background:rgba(139,63,209,.15); color:var(--epic);}
  .bg-mythic{background:rgba(224,97,31,.15); color:var(--mythic);}

  #toastWrap{position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;}
  .toast{background:#fff; border:2px solid var(--ink); color:#111; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; animation:toastIn .3s;}
  @keyframes toastIn{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2); border-radius:10px;}

  /* CHAT UNREAD BADGE */
  #chatUnreadBadge{
    position:absolute; top:2px; right:calc(50% - 26px); background:#ff4757; color:#fff;
    font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px;
    display:none; align-items:center; justify-content:center; padding:0 4px;
    border:2px solid #fff;
  }
  #chatUnreadBadge.show{display:flex;}
  #panel-worldchat{display:none; flex-direction:column;}
  #panel-worldchat.show{display:flex;}

  /* RANK SYSTEM */
  #rankBtn{border:none; cursor:pointer; color:var(--text); font-family:inherit;}
  #rankBtn .ic{font-size:16px;}

  /* ACHIEVEMENTS */
  #achieveCard{
    background:var(--panel); border:3px solid var(--ink); border-radius:18px;
    padding:16px; width:min(340px,86vw); max-height:80vh; overflow-y:auto; position:relative;
  }
  .achieveRow{
    background:var(--panel); border-radius:16px; padding:14px 14px 12px; margin-bottom:12px;
    border:3px solid var(--ink);
  }
  .achieveRowHead{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .achieveRowIcon{font-size:20px;}
  .achieveRowName{font-weight:800; font-size:14px; color:var(--text);}
  .achieveSegBar{display:flex; gap:6px; border:3px solid var(--ink); border-radius:20px; background:#fff; padding:5px;}
  .achieveSeg{flex:1; height:20px; border-radius:20px; background:#e9eef1; transition:background .25s ease;}
  .achieveSeg.filled{background:linear-gradient(180deg,#ffe08a,var(--gold-dark));}
  .achieveSeg.claimedSeg{background:linear-gradient(180deg,#8ee8ab,var(--uncommon));}
  .achieveRowBottom{display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:10px;}
  .achieveStreakLabel{font-size:14px; font-weight:800; color:var(--text); white-space:nowrap;}
  .achieveRewardPill{
    border:3px solid var(--ink); border-radius:20px; padding:8px 14px; font-weight:900; font-size:13px;
    white-space:nowrap; flex-shrink:0; background:#e3e9ec; color:#8a99a3;
  }
  .achieveRewardPill.ready{background:linear-gradient(180deg,#8ee8ab,var(--uncommon)); color:#04351f; cursor:pointer;}
  .achieveRewardPill.ready:active{transform:translateY(1px);}
  .achieveRewardPill.maxed{background:linear-gradient(180deg,#ffe08a,var(--gold-dark)); color:#3a2400;}

  .rankHead{
    text-align:center; background:var(--panel); border-radius:16px; padding:20px 14px 16px;
    margin-bottom:16px; border:3px solid var(--ink);
  }
  .rankBigIcon{font-size:52px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
  .rankBigName{font-size:20px; font-weight:800; margin-top:4px;}
  .rankPointsText{font-size:13px; color:var(--gold-dark); font-weight:700; margin-top:2px;}
  .rankProgWrap{margin-top:14px;}
  .rankProgBar{
    width:100%; height:16px; background:#e9eef1; border-radius:10px; overflow:hidden;
    border:2px solid var(--ink);
  }
  .rankProgFill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),#fff3c0); transition:width .4s ease;}
  .rankProgLabel{font-size:11.5px; color:var(--text-dim); margin-top:6px; font-weight:600;}

  .rankListHead{font-size:12.5px; color:var(--text-dim); font-weight:800; margin:4px 2px 8px;}
  .rankRow{
    display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:14px;
    padding:11px 12px; margin-bottom:8px; border:3px solid var(--ink); opacity:.55;
  }
  .rankRow.reached{opacity:1;}
  .rankRow.current{border-color:var(--gold-dark); background:var(--panel-light);}
  .rrIcon{font-size:28px; width:36px; text-align:center; flex-shrink:0;}
  .rrInfo{flex:1; min-width:0;}
  .rrName{font-weight:800; font-size:14px;}
  .rrCur{color:var(--gold-dark); font-size:11px; font-weight:700;}
  .rrMin{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
  .rrStatus{font-size:16px; flex-shrink:0;}

  .rankInfoNote{
    margin-top:6px; font-size:12px; color:var(--text-dim); background:#fff;
    border:2px solid rgba(0,0,0,.12); border-radius:12px; padding:10px 12px; line-height:1.5;
  }

  .lbRow{
    display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:14px;
    padding:9px 12px; margin-bottom:7px; border:3px solid var(--ink);
  }
  .lbRow.me{border-color:var(--gold-dark); background:var(--panel-light);}
  .lbRank{font-weight:800; font-size:14px; width:26px; text-align:center; flex-shrink:0; color:var(--text-dim);}
  .lbRow.top1 .lbRank{color:#c9950a;}
  .lbRow.top2 .lbRank{color:#7c8e9a;}
  .lbRow.top3 .lbRank{color:#b8712c;}
  .lbAvatar{
    width:32px; height:32px; border-radius:50%; background:#eef6fb; border:2px solid var(--ink); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; overflow:hidden;
  }
  .lbAvatar img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
  .lbInfo{flex:1; min-width:0;}
  .lbName{font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lbRankName{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .lbPts{font-weight:800; font-size:13px; color:var(--gold-dark); flex-shrink:0; white-space:nowrap;}

  .catchPopup .crankpts{font-size:13.5px; color:var(--gold-dark); font-weight:800; margin-top:4px;}
  .catchPopup .crankup{
    font-size:14px; font-weight:800; margin-top:8px; padding:6px 12px; border-radius:12px;
    background:#fff3cf; border:2px solid var(--gold-dark); color:#7a5600;
    animation:rankUpGlow 1s infinite alternate;
  }
  @keyframes rankUpGlow{ from{filter:brightness(1);} to{filter:brightness(1.2);} }

  /* PROFILE CARD */
  #profileCard{
    background:var(--panel); border:3px solid var(--ink); border-radius:18px;
    padding:16px; width:min(320px,86vw); position:relative;
  }
  .profileTopRow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .profileAvatarCircle{
    width:60px; height:60px; border-radius:50%; background:var(--gold); color:#3a2400;
    border:3px solid var(--ink); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; overflow:hidden;
  }
  .profileAvatarCircle img{width:100%; height:100%; object-fit:cover; display:block;}
  .profileNameBox{
    flex:1; min-width:0; background:var(--panel); border:3px solid var(--ink); border-radius:14px;
    padding:12px 10px; font-weight:800; font-size:14.5px; color:var(--text); text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .profileGrid{display:flex; gap:10px; align-items:stretch;}
  .profileLeftCol{flex:1; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .profileStatBox{
    background:#f2f7fb; border:2.5px solid var(--ink); border-radius:12px;
    padding:10px; display:flex; align-items:center; justify-content:center; gap:6px; flex:1;
  }
  .profileStatBox .psIcon{font-size:14px;}
  .profileStatBox .psValue{font-size:15px; font-weight:800; color:var(--text); white-space:nowrap;}
  .profileTopBox{
    flex:1; background:linear-gradient(180deg,#fff3cf,#ffe9a8); border:2.5px solid var(--ink); border-radius:14px;
    padding:12px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-width:0;
  }
  .ptbTitle{font-size:12.5px; font-weight:800; color:#7a5600; text-align:center;}
  .ptbRow{width:100%; display:flex; flex-direction:column; align-items:center; gap:1px;}
  .ptbRow .ptbLabel{font-size:11px; color:#7a5600; font-weight:700;}
  .ptbRow .ptbValue{font-size:15px; font-weight:900; color:var(--gold-dark);}
  #profileAchieveBtn{
    display:flex; width:100%; margin-top:12px; padding:11px 10px; border-radius:12px;
    border:3px solid var(--ink); background:linear-gradient(180deg,#ffe08a,var(--gold-dark)); color:#3a2400;
    font-weight:900; font-size:14px; cursor:pointer; align-items:center; justify-content:center; gap:6px;
  }
  #profileAchieveBtn:active{ transform:translateY(1px); }
  #profileKbBtn{
    display:none; width:100%; margin-top:12px; padding:11px 10px; border-radius:12px;
    border:3px solid var(--ink); background:linear-gradient(180deg,#7fe0a0,#3fbf6d); color:#083a1c;
    font-weight:900; font-size:14px; cursor:pointer; align-items:center; justify-content:center; gap:6px;
  }
  #profileKbBtn:active{ transform:translateY(1px); }
  #profileKbBtn.sent{ background:linear-gradient(180deg,#dfe6ee,#c3cbd6); color:#3a4552; cursor:default; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="back-btn" onclick="goBack()">←</button>
      <button class="stat" id="playerNameBtn" style="border:2px solid var(--ink); cursor:pointer; color:var(--text); font-family:inherit;">
        <span class="ic">👤</span>
      </button>
      <button class="stat" id="baucuaBtn" onclick="window.location.href='baucua'" style="border:2px solid var(--ink); cursor:pointer; color:var(--text); font-family:inherit;" title="Chơi Bầu Cua">
        <span class="ic">🎲</span>
      </button>
    </div>
    <div id="headerMidGroup">
      <button class="stat" id="bookShopBtn" style="border:2px solid var(--ink); cursor:pointer; color:var(--text); font-family:inherit;" title="Ráp Sách Phép">
        <span class="ic">📚</span>
      </button>
      <button class="stat" id="enchantBtn" style="border:2px solid var(--ink); cursor:pointer; color:var(--text); font-family:inherit;" title="Phù Phép Cần Câu">
        <span class="ic">🪄</span>
      </button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="stat" id="rankBtn"><span class="ic" id="rankIcon">🥉</span></button>
      <button class="stat" id="leaderboardBtn" onclick="window.location.href='bangxephang'" style="border:none; cursor:pointer; color:var(--text); font-family:inherit;"><span class="ic">🪙</span><span id="coinDisplay">0</span></button>
      <div class="stat"><span id="fishCountDisplay">0</span><span class="ic">🔥</span></div>
    </div>
  </div>

  <!-- GAME AREA -->
  <div id="gameArea">
    <div id="waterLine"></div>
    <div id="rodArea">
      <div id="rodIcon">🎣</div>
    </div>
    <div id="line"></div>
    <div id="hook">🪝</div>

    <div id="catchZone">
      <div id="fishSilhouette" style="display:none;">🐟</div>
      <div id="statusText">Nhấn "Thả câu" để bắt đầu!</div>
    </div>

    <div id="comboBar"><div id="comboFill"></div></div>
    <div id="rhythmWrap">
      <div id="rhythmTrack">
        <div id="rhythmZone"></div>
        <div id="rhythmCursor"></div>
      </div>
      <div id="rhythmHint">Nhấn đúng lúc con trỏ vào vùng xanh!</div>
    </div>
    <div id="toastWrap"></div>

    <button id="castBtn">🎣 THẢ CÂU</button>
  </div>

  <!-- NAV -->
  <div id="nav">
    <button class="navBtn active" data-panel="game"><span class="navIc">🎣</span>Câu cá</button>
    <button class="navBtn" data-panel="shop"><span class="navIc">🏪</span>Cửa hàng</button>
    <button class="navBtn" data-panel="inventory"><span class="navIc">🎒</span>Túi đồ</button>
    <button class="navBtn" data-panel="collection"><span class="navIc">📖</span>Bộ sưu tập</button>
    <button class="navBtn" data-panel="worldchat">
      <span class="navIc">💬</span>Chat chung
      <div id="chatUnreadBadge">0</div>
    </button>
  </div>

  <!-- PANELS -->
  <div class="panel" id="panel-shop">
    <div class="panelHeader">
      <div class="phTitle">🏪 Cửa hàng cần câu</div>
      <button class="closeBtn" onclick="closePanel('shop')">✕</button>
    </div>
    <div class="panelBody" id="shopBody"></div>
  </div>

  <div class="panel" id="panel-inventory">
    <div class="panelHeader">
      <div class="phTitle">🎒 Túi cá của bạn</div>
      <button class="closeBtn" onclick="closePanel('inventory')">✕</button>
    </div>
    <div class="panelBody" id="inventoryBody"></div>
  </div>

  <div class="panel" id="panel-collection">
    <div class="panelHeader">
      <div class="phTitle">📖 Bộ sưu tập cá</div>
      <button class="closeBtn" onclick="closePanel('collection')">✕</button>
    </div>
    <div class="panelBody" id="collectionBody"></div>
  </div>

  <div class="panel" id="panel-worldchat">
    <div class="panelHeader">
      <div id="wcBrand">
        <div id="wcChatIcon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
        </div>
        <div id="wcChatText">Chat chung</div>
      </div>
      <button id="btnGoArena" onclick="window.location.href='dautruong'">Đấu trường</button>
      <button class="closeBtn" onclick="closePanel('worldchat')">✕</button>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputBar">
      <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." maxlength="200">
      <button id="sendChatBtn">➔</button>
    </div>
  </div>

</div>

<script>
  function goBack() {
    window.history.back();
  }

  function closePanel(panelId) {
    const p = document.getElementById('panel-' + panelId);
    if(p) p.classList.remove('show');
    const btn = document.querySelector(`.navBtn[data-panel="${panelId}"]`);
    if(btn) btn.classList.remove('active');
    document.querySelector('.navBtn[data-panel="game"]').classList.add('active');
  }

  // Navigation Logic
  document.querySelectorAll('.navBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetPanel = btn.getAttribute('data-panel');
      document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));

      if (targetPanel !== 'game') {
        const p = document.getElementById('panel-' + targetPanel);
        if(p) p.classList.add('show');
      }
    });
  });
</script>
</body>
</html>
