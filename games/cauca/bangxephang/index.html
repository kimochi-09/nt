<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 Bảng Xếp Hạng Xu - Fishing World</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-deep:#1288c9;
    --bg-mid:#29b6f6;
    --gold:#ffcd3c;
    --gold-dark:#e0a900;
    --panel:#ffffff;
    --panel-light:#fff3cf;
    --text:#111318;
    --text-dim:#4a6274;
    --silver:#7c8e9a;
    --bronze:#b8712c;
    --ink:#111111;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#4fc3f7 0%, #29b6f6 55%, #1288c9 100%);
    color:var(--text);
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  @media (min-width:701px){ #app{max-width:640px;} }

  #header{
    display:flex; align-items:center; gap:10px;
    padding:14px 14px; background:#29b6f6;
    border-bottom:4px solid var(--ink); position:sticky; top:0; z-index:10;
  }
  #header h1{font-size:17px; margin:0; flex:1; display:flex; align-items:center; gap:8px; color:var(--text); font-weight:900;}
  .closeBtn{
    border:2px solid var(--ink); background:#fff; color:var(--text);
    font-size:16px; width:34px; height:34px; border-radius:50%; cursor:pointer;
  }

  #content{padding:14px; flex:1;}
  #status{text-align:center; color:var(--text-dim); font-size:13px; padding:20px 0;}

  .rankRow{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:3px solid var(--ink);
    border-radius:14px; padding:10px 12px; margin-bottom:8px;
  }
  .rankRow.me{ border-color:var(--gold-dark); background:var(--panel-light); }
  .rankRow.top1{ background:linear-gradient(135deg, #fff3cf, var(--panel)); }
  .rankRow.top2{ background:linear-gradient(135deg, #eef2f5, var(--panel)); }
  .rankRow.top3{ background:linear-gradient(135deg, #fbe6d3, var(--panel)); }

  .rankNum{
    width:30px; flex-shrink:0; text-align:center; font-weight:800; font-size:15px; color:var(--text-dim);
  }
  .rankNum.medal{font-size:20px;}
  .avatarIc{
    width:38px; height:38px; border-radius:50%; background:var(--gold-dark); color:#fff; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
    overflow:hidden;
  }
  .avatarIc img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .rInfo{flex:1; min-width:0;}
  .rName{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
  .rSub{font-size:11px; color:var(--text-dim);}
  .rCoin{display:flex; align-items:center; gap:4px; font-weight:800; color:var(--gold-dark); font-size:14.5px; flex-shrink:0;}

  #refreshBtn{
    display:block; margin:16px auto 6px; border:3px solid var(--ink); background:var(--gold); color:#3a2400;
    padding:9px 18px; border-radius:20px; font-weight:800; font-size:13px; cursor:pointer;
    box-shadow:0 3px 0 var(--gold-dark);
  }
  #refreshBtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--gold-dark);}
  #updatedAt{text-align:center; color:var(--text-dim); font-size:11px; margin-top:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🏆 Bảng Xếp Hạng Xu</h1>
    <button class="closeBtn" onclick="window.location.href='../'">✕</button>
  </div>
  <div id="content">
    <div id="status">Đang tải bảng xếp hạng...</div>
    <div id="list"></div>
    <button id="refreshBtn" onclick="loadLeaderboard()">🔄 Làm mới</button>
    <div id="updatedAt"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDH_skpX3D9sD3zz3iiyrHnB28BIVvIMM0",
  authDomain: "hihi-c6af6.firebaseapp.com",
  databaseURL: "https://hihi-c6af6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hihi-c6af6",
  storageBucket: "hihi-c6af6.firebasestorage.app",
  messagingSenderId: "164013580789",
  appId: "1:164013580789:web:94227e94c6d517170f40bc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myId = (function(){ try{ return localStorage.getItem('nt_myId'); }catch(e){ return null; } })();

const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const updatedEl = document.getElementById('updatedAt');
const medals = ['🥇','🥈','🥉'];

let totalFishCount = 60; // sẽ được thay bằng số thật lấy từ Firebase (fishData)

function loadLeaderboard(){
  statusEl.style.display = 'block';
  statusEl.textContent = 'Đang tải bảng xếp hạng...';
  listEl.innerHTML = '';

  const fishDataPromise = db.ref('fishData').once('value').then(snap => {
    const val = snap.val();
    if(val){
      totalFishCount = Object.keys(val).length;
    }
  }).catch(()=>{});

  const usersPromise = fishDataPromise.then(() => db.ref('users').once('value'));
  const profilesPromise = db.ref('user_profiles').once('value').catch(()=>null);

  Promise.all([usersPromise, profilesPromise]).then(([usersSnap, profilesSnap]) => {
    const val = usersSnap.val() || {};
    const profiles = (profilesSnap && profilesSnap.val()) || {};
    const rows = [];
    Object.keys(val).forEach(uid => {
      const gs = val[uid] && val[uid].gameState;
      if(!gs) return;
      const profile = profiles[uid] || null;
      // Ưu tiên tên/ảnh đã đổi trong hồ sơ (user_profiles). Nếu không có, dùng mặc định trong gameState.
      const displayName = (profile && profile.displayName) ? profile.displayName : (gs.nickname || uid);
      const avatarImg = (profile && profile.avatar) ? profile.avatar : null;
      rows.push({
        uid,
        coins: typeof gs.coins === 'number' ? gs.coins : 0,
        nickname: displayName,
        avatarImg,
        avatarIcon: gs.avatar || '👤',
        fishCount: gs.caughtIds ? Object.keys(gs.caughtIds).length : 0
      });
    });
    rows.sort((a,b) => b.coins - a.coins);

    if(rows.length === 0){
      statusEl.textContent = 'Chưa có dữ liệu người chơi nào.';
      return;
    }
    statusEl.style.display = 'none';

    rows.forEach((r, i) => {
      const rank = i+1;
      const div = document.createElement('div');
      div.className = 'rankRow' + (r.uid === myId ? ' me' : '') + (rank<=3 ? ' top'+rank : '');
      const avatarHtml = r.avatarImg
        ? `<img src="${escapeHtml(r.avatarImg)}" alt="">`
        : r.avatarIcon;
      div.innerHTML = `
        <div class="rankNum ${rank<=3?'medal':''}">${rank<=3 ? medals[rank-1] : rank}</div>
        <div class="avatarIc">${avatarHtml}</div>
        <div class="rInfo">
          <div class="rName">${escapeHtml(r.nickname)}${r.uid===myId?' (Bạn)':''}</div>
          <div class="rSub">🐟 ${r.fishCount}/${totalFishCount} loài cá</div>
        </div>
        <div class="rCoin">🪙 ${r.coins.toLocaleString('vi-VN')}</div>
      `;
      listEl.appendChild(div);
    });

    updatedEl.textContent = 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
  }).catch(err => {
    statusEl.textContent = '❌ Không tải được dữ liệu. Vui lòng thử lại.';
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadLeaderboard();
</script>
</body>
</html>
