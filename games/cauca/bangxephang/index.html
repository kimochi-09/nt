<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 Bảng Xếp Hạng Xu - Fishing World</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-deep:#04263f;
    --bg-mid:#0a4a72;
    --gold:#ffd35c;
    --gold-dark:#e0a900;
    --panel:#0e2f4a;
    --panel-light:#123a5c;
    --text:#eaf6ff;
    --text-dim:#9fc4de;
    --silver:#cfd8e3;
    --bronze:#d99a5b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#0d3a5c 0%, var(--bg-deep) 60%, #021625 100%);
    color:var(--text);
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  @media (min-width:701px){ #app{max-width:640px;} }

  #header{
    display:flex; align-items:center; gap:10px;
    padding:14px 14px; background:rgba(2,20,34,.85); backdrop-filter:blur(4px);
    border-bottom:1px solid rgba(255,255,255,.08); position:sticky; top:0; z-index:10;
  }
  #header h1{font-size:17px; margin:0; flex:1; display:flex; align-items:center; gap:8px;}
  .closeBtn{
    border:none; background:rgba(255,255,255,.08); color:var(--text);
    font-size:16px; width:34px; height:34px; border-radius:50%; cursor:pointer;
  }

  #content{padding:14px; flex:1;}
  #status{text-align:center; color:var(--text-dim); font-size:13px; padding:20px 0;}

  .rankRow{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid rgba(255,255,255,.06);
    border-radius:14px; padding:10px 12px; margin-bottom:8px;
  }
  .rankRow.me{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .rankRow.top1{ background:linear-gradient(135deg, rgba(255,211,92,.18), var(--panel)); }
  .rankRow.top2{ background:linear-gradient(135deg, rgba(207,216,227,.15), var(--panel)); }
  .rankRow.top3{ background:linear-gradient(135deg, rgba(217,154,91,.18), var(--panel)); }

  .rankNum{
    width:30px; flex-shrink:0; text-align:center; font-weight:800; font-size:15px; color:var(--text-dim);
  }
  .rankNum.medal{font-size:20px;}
  .avatarIc{
    width:38px; height:38px; border-radius:50%; background:var(--gold-dark); color:#2a1c00;
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .rInfo{flex:1; min-width:0;}
  .rName{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rSub{font-size:11px; color:var(--text-dim);}
  .rCoin{display:flex; align-items:center; gap:4px; font-weight:800; color:var(--gold); font-size:14.5px; flex-shrink:0;}

  #refreshBtn{
    display:block; margin:16px auto 6px; border:none; background:var(--panel-light); color:var(--text);
    padding:9px 18px; border-radius:20px; font-weight:700; font-size:13px; cursor:pointer;
  }
  #updatedAt{text-align:center; color:var(--text-dim); font-size:11px; margin-top:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🏆 Bảng Xếp Hạng Xu</h1>
    <button class="closeBtn" onclick="window.location.href='index.html'">✕</button>
  </div>
  <div id="content">
    <div id="status">Đang tải bảng xếp hạng...</div>
    <div id="list"></div>
    <button id="refreshBtn" onclick="loadLeaderboard()">🔄 Làm mới</button>
    <div id="updatedAt"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDH_skpX3D9sD3zz3iiyrHnB28BIVvIMM0",
  authDomain: "hihi-c6af6.firebaseapp.com",
  databaseURL: "https://hihi-c6af6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hihi-c6af6",
  storageBucket: "hihi-c6af6.firebasestorage.app",
  messagingSenderId: "164013580789",
  appId: "1:164013580789:web:94227e94c6d517170f40bc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myId = (function(){ try{ return localStorage.getItem('nt_myId'); }catch(e){ return null; } })();

const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const updatedEl = document.getElementById('updatedAt');
const medals = ['🥇','🥈','🥉'];

let totalFishCount = 60; // sẽ được thay bằng số thật lấy từ Firebase (fishData)

function loadLeaderboard(){
  statusEl.style.display = 'block';
  statusEl.textContent = 'Đang tải bảng xếp hạng...';
  listEl.innerHTML = '';

  const fishDataPromise = db.ref('fishData').once('value').then(snap => {
    const val = snap.val();
    if(val){
      totalFishCount = Object.keys(val).length;
    }
  }).catch(()=>{});

  fishDataPromise.then(() => db.ref('users').once('value')).then(snap => {
    const val = snap.val() || {};
    const rows = [];
    Object.keys(val).forEach(uid => {
      const gs = val[uid] && val[uid].gameState;
      if(!gs) return;
      rows.push({
        uid,
        coins: typeof gs.coins === 'number' ? gs.coins : 0,
        nickname: gs.nickname || uid,
        avatar: gs.avatar || '👤',
        fishCount: gs.caughtIds ? Object.keys(gs.caughtIds).length : 0
      });
    });
    rows.sort((a,b) => b.coins - a.coins);

    if(rows.length === 0){
      statusEl.textContent = 'Chưa có dữ liệu người chơi nào.';
      return;
    }
    statusEl.style.display = 'none';

    rows.forEach((r, i) => {
      const rank = i+1;
      const div = document.createElement('div');
      div.className = 'rankRow' + (r.uid === myId ? ' me' : '') + (rank<=3 ? ' top'+rank : '');
      div.innerHTML = `
        <div class="rankNum ${rank<=3?'medal':''}">${rank<=3 ? medals[rank-1] : rank}</div>
        <div class="avatarIc">${r.avatar}</div>
        <div class="rInfo">
          <div class="rName">${escapeHtml(r.nickname)}${r.uid===myId?' (Bạn)':''}</div>
          <div class="rSub">🐟 ${r.fishCount}/${totalFishCount} loài cá</div>
        </div>
        <div class="rCoin">🪙 ${r.coins.toLocaleString('vi-VN')}</div>
      `;
      listEl.appendChild(div);
    });

    updatedEl.textContent = 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
  }).catch(err => {
    statusEl.textContent = '❌ Không tải được dữ liệu. Vui lòng thử lại.';
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadLeaderboard();
</script>
</body>
</html>
