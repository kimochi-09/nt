<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎲 Bầu Cua Tôm Cá</title>
<style>
  :root{
    --bg-deep:#b3221a;
    --bg-mid:#d6392f;
    --bg-light:#ff6a5c;
    --gold:#ffcd3c;
    --gold-dark:#e0a900;
    --panel:#ffffff;
    --panel-light:#fff3cf;
    --text:#111318;
    --text-dim:#4a6274;
    --ink:#111111;
    --nav-h:58px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#ff8a65 0%, #d6392f 55%, #b3221a 100%);
    color:var(--text);
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{position:relative; width:100%; height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.5);}
  @media (min-width:701px){
    #app{ max-width:720px; border-radius:0; box-shadow:none; }
  }

  /* HEADER */
  #header{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:#d6392f;
    border-bottom:4px solid var(--ink); z-index:20; flex-shrink:0;
  }
  #header .stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px; background:#fff; border:2px solid var(--ink); color:var(--text); padding:5px 9px; border-radius:20px;}
  .back-btn{
    border:2px solid var(--ink); background:#fff; color:var(--text);
    font-size:17px; cursor:pointer; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn:active{transform:scale(0.9);}
  #resetBtn{border:2px solid var(--ink); background:#fff; color:var(--text); font-size:15px; padding:5px 9px; line-height:1; border-radius:50%;}

  /* MAIN AREA */
  #gameArea{
    position:relative; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px 12px 130px;
  }

  #bowlWrap{
    display:flex; flex-direction:column; align-items:center; margin-bottom:14px;
  }
  #bowlStage{
    position:relative; width:180px; height:150px; display:flex; align-items:center; justify-content:center;
  }
  #diceRow{
    display:flex; gap:8px; z-index:2;
  }
  .diceFace{
    width:52px; height:52px; background:#fff; border:3px solid var(--ink); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  #bowlLid{
    position:absolute; width:190px; height:120px; bottom:0; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#cfd6da,#8a949c);
    border:4px solid var(--ink); border-radius:50% 50% 46% 46% / 70% 70% 30% 30%;
    box-shadow:0 8px 14px rgba(0,0,0,.4);
    z-index:5; transition:transform .5s ease, opacity .3s ease;
  }
  #bowlLid.hidden{ transform:translateY(-160px) rotate(-25deg); opacity:0; pointer-events:none; }
  #bowlLid::after{
    content:''; position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:36px; height:14px; background:#8a949c; border:4px solid var(--ink); border-radius:8px;
  }
  .shaking{ animation:shakeAnim .12s infinite; }
  @keyframes shakeAnim{
    0%{transform:translateX(-50%) rotate(0deg);}
    25%{transform:translateX(-56%) rotate(-4deg);}
    50%{transform:translateX(-44%) rotate(4deg);}
    75%{transform:translateX(-52%) rotate(-3deg);}
    100%{transform:translateX(-50%) rotate(0deg);}
  }

  #resultText{
    text-align:center; font-size:14px; font-weight:800; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.5); min-height:20px; margin-bottom:6px;
  }

  #betTotalBar{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:3px solid var(--ink); border-radius:14px;
    padding:9px 14px; font-weight:800; font-size:13px; margin-bottom:10px;
  }
  #betTotalBar .clearBtn{
    background:#eef3f6; border:2px solid var(--ink); border-radius:10px; padding:6px 10px; font-size:12px; font-weight:800; color:var(--text);
  }

  #board{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  }
  .cell{
    position:relative; background:linear-gradient(180deg,#fff3cf,#ffe08a);
    border:3px solid var(--ink); border-radius:16px; padding:10px 6px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 5px 0 rgba(0,0,0,.2);
    transition:transform .1s;
  }
  .cell:active{transform:scale(.95);}
  .cell.win{ box-shadow:0 0 0 4px var(--gold), 0 5px 0 rgba(0,0,0,.2); animation:winPulse .6s ease-in-out 2; }
  @keyframes winPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .cell .ic{font-size:34px;}
  .cell .nm{font-size:12px; font-weight:800; color:#5a3d00;}
  .cell .betAmt{
    font-size:12px; font-weight:900; color:#fff; background:var(--bg-mid);
    border:2px solid var(--ink); border-radius:10px; padding:2px 8px; min-height:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .cell .hitBadge{
    position:absolute; top:-8px; right:-8px; background:var(--gold); color:#3a2400;
    border:2px solid var(--ink); border-radius:50%; width:24px; height:24px;
    display:none; align-items:center; justify-content:center; font-size:12px; font-weight:900;
  }
  .cell.win .hitBadge{ display:flex; }

  #chipRow{
    display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .chip{
    background:linear-gradient(180deg,#ffe08a,var(--gold-dark)); color:#3a2400; border:3px solid var(--ink);
    border-radius:50%; width:52px; height:52px; font-weight:900; font-size:12.5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 #9e6f00;
  }
  .chip.active{ box-shadow:0 0 0 3px #fff, 0 4px 0 #9e6f00; }
  .chip:active{ transform:translateY(2px); box-shadow:0 2px 0 #9e6f00; }

  #shakeBtn{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#ffe08a,var(--gold-dark));
    color:#3a2400; border:4px solid var(--ink); border-radius:40px; padding:14px 38px;
    font-size:16px; font-weight:900; box-shadow:0 6px 0 #9e6f00, 0 10px 18px rgba(0,0,0,.4);
    cursor:pointer; z-index:15; letter-spacing:.5px; width:88%; max-width:340px;
  }
  #shakeBtn:active{transform:translateX(-50%) translateY(4px); box-shadow:0 2px 0 #9e6f00, 0 4px 10px rgba(0,0,0,.4);}
  #shakeBtn:disabled{opacity:.5; cursor:default;}

  #footerBar{
    position:absolute; bottom:0; left:0; right:0; padding:0 12px 14px;
    display:flex; flex-direction:column; align-items:center;
    background:linear-gradient(180deg, rgba(179,34,26,0) 0%, rgba(179,34,26,.95) 40%);
    z-index:14; pointer-events:none;
  }
  #footerBar > *{ pointer-events:auto; }

  #toast{
    position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-60px);
    background:#111; color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; font-weight:700;
    z-index:999; opacity:0; transition:transform .3s ease, opacity .3s ease; max-width:88%; text-align:center;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  #historyRow{
    display:flex; gap:6px; justify-content:center; margin-top:12px; flex-wrap:wrap;
  }
  .histIc{ font-size:18px; background:#fff; border:2px solid var(--ink); border-radius:8px; padding:3px 5px; }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div style="display:flex; gap:8px;">
      <div class="stat"><span class="ic">🪙</span><span id="coinDisplay">0</span></div>
    </div>
    <button id="resetBtn" title="Chơi lại từ đầu">↺</button>
  </div>

  <div id="gameArea">
    <div id="bowlWrap">
      <div id="bowlStage">
        <div id="diceRow">
          <div class="diceFace" id="dice0">❔</div>
          <div class="diceFace" id="dice1">❔</div>
          <div class="diceFace" id="dice2">❔</div>
        </div>
        <div id="bowlLid"></div>
      </div>
      <div id="resultText">Đặt cược rồi bấm Lắc Xúc Xắc!</div>
      <div id="historyRow"></div>
    </div>

    <div id="betTotalBar">
      <span>Tổng cược: <span id="totalBetText">0</span> 🪙</span>
      <button class="clearBtn" id="clearBetBtn">Xoá cược</button>
    </div>

    <div id="board"></div>

    <div id="chipRow"></div>
  </div>

  <div id="footerBar">
    <button id="shakeBtn">🎲 LẮC XÚC XẮC</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){

/* ============== DATA ============== */
const FACES = [
  {id:'bau',  icon:'🎃', name:'Bầu'},
  {id:'cua',  icon:'🦀', name:'Cua'},
  {id:'tom',  icon:'🦐', name:'Tôm'},
  {id:'ca',   icon:'🐟', name:'Cá'},
  {id:'ga',   icon:'🐓', name:'Gà'},
  {id:'nai',  icon:'🦌', name:'Nai'}
];
const CHIP_VALUES = [1000, 5000, 10000, 50000, 100000];

/* ============== STATE ============== */
const SAVE_KEY = "baucua_save_v1";
function getDefaultState(){
  return { coins: 100 };
}
let state = getDefaultState();
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ state = Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
loadState();

let bets = {};      // faceId -> so tien dang cuoc
let selectedChip = CHIP_VALUES[0];
let history = [];   // mang cac lan lac gan nhat, moi phan tu la [faceId,faceId,faceId]
let isShaking = false;

/* ============== DOM ============== */
const coinDisplay = document.getElementById('coinDisplay');
const board = document.getElementById('board');
const chipRow = document.getElementById('chipRow');
const totalBetText = document.getElementById('totalBetText');
const resultText = document.getElementById('resultText');
const shakeBtn = document.getElementById('shakeBtn');
const bowlLid = document.getElementById('bowlLid');
const historyRow = document.getElementById('historyRow');
const diceEls = [document.getElementById('dice0'), document.getElementById('dice1'), document.getElementById('dice2')];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function updateHeader(){
  coinDisplay.textContent = (state.coins||0).toLocaleString('vi-VN');
}

function totalBet(){
  return Object.values(bets).reduce((a,b)=>a+b, 0);
}

function renderBoard(){
  board.innerHTML = '';
  FACES.forEach(f=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell_'+f.id;
    const amt = bets[f.id] || 0;
    cell.innerHTML = `
      <div class="hitBadge" id="hit_${f.id}">x0</div>
      <div class="ic">${f.icon}</div>
      <div class="nm">${f.name}</div>
      <div class="betAmt">${amt>0 ? amt.toLocaleString('vi-VN') : '-'}</div>
    `;
    cell.addEventListener('click', ()=>placeBet(f.id));
    board.appendChild(cell);
  });
}

function renderChips(){
  chipRow.innerHTML = '';
  CHIP_VALUES.forEach(v=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (v===selectedChip ? ' active' : '');
    chip.textContent = v>=1000 ? (v/1000)+'k' : v;
    chip.addEventListener('click', ()=>{
      selectedChip = v;
      renderChips();
    });
    chipRow.appendChild(chip);
  });
}

function placeBet(faceId){
  if(isShaking) return;
  if((state.coins||0) < selectedChip){
    toast('Không đủ xu để đặt cược!');
    return;
  }
  state.coins -= selectedChip;
  bets[faceId] = (bets[faceId]||0) + selectedChip;
  saveState();
  updateHeader();
  renderBetAmounts();
}

function renderBetAmounts(){
  FACES.forEach(f=>{
    const amt = bets[f.id] || 0;
    const el = document.querySelector('#cell_'+f.id+' .betAmt');
    if(el) el.textContent = amt>0 ? amt.toLocaleString('vi-VN') : '-';
  });
  totalBetText.textContent = totalBet().toLocaleString('vi-VN');
}

function clearBets(){
  if(isShaking) return;
  const refund = totalBet();
  if(refund<=0) return;
  state.coins += refund;
  bets = {};
  saveState();
  updateHeader();
  renderBetAmounts();
  toast('Đã huỷ cược, hoàn lại '+refund.toLocaleString('vi-VN')+' xu');
}

function clearWinMarks(){
  FACES.forEach(f=>{
    const cell = document.getElementById('cell_'+f.id);
    if(cell) cell.classList.remove('win');
    const hit = document.getElementById('hit_'+f.id);
    if(hit) hit.textContent = 'x0';
  });
}

function pushHistory(roll){
  history.unshift(roll);
  history = history.slice(0,8);
  historyRow.innerHTML = '';
  history.forEach(roll=>{
    roll.forEach(fid=>{
      const f = FACES.find(x=>x.id===fid);
      const span = document.createElement('span');
      span.className = 'histIc';
      span.textContent = f.icon;
      historyRow.appendChild(span);
    });
  });
}

function doShake(){
  if(isShaking) return;
  if(totalBet()<=0){
    toast('Hãy đặt cược trước khi lắc!');
    return;
  }
  isShaking = true;
  shakeBtn.disabled = true;
  clearWinMarks();
  resultText.textContent = 'Đang lắc xúc xắc...';

  bowlLid.classList.remove('hidden');
  bowlLid.classList.add('shaking');
  diceEls.forEach(d=> d.textContent = '❔');

  // random ket qua truoc, hien thi sau khi mo bat
  const roll = [randFace(), randFace(), randFace()];

  setTimeout(()=>{
    bowlLid.classList.remove('shaking');
    bowlLid.classList.add('hidden');
    diceEls.forEach((d,i)=>{
      d.textContent = FACES.find(f=>f.id===roll[i]).icon;
    });
    settleRound(roll);
  }, 1400);
}

function randFace(){
  return FACES[Math.floor(Math.random()*FACES.length)].id;
}

function settleRound(roll){
  const counts = {};
  roll.forEach(fid=> counts[fid] = (counts[fid]||0)+1);

  let totalWin = 0;
  let totalReturned = 0;
  Object.keys(bets).forEach(faceId=>{
    const betAmt = bets[faceId];
    if(betAmt<=0) return;
    const hitCount = counts[faceId] || 0;
    if(hitCount>0){
      const winAmt = betAmt * hitCount;
      const returned = betAmt + winAmt;
      totalReturned += returned;
      totalWin += winAmt;
      const cell = document.getElementById('cell_'+faceId);
      if(cell) cell.classList.add('win');
      const hit = document.getElementById('hit_'+faceId);
      if(hit) hit.textContent = 'x'+hitCount;
    }
  });

  state.coins += totalReturned;
  const lost = totalBet() - totalReturned + totalWin - totalWin; // giu don gian, tinh lai ben duoi
  const totalPlaced = totalBet();
  const netChange = totalReturned - totalPlaced;

  pushHistory(roll);

  if(netChange > 0){
    resultText.textContent = `🎉 Trúng! Nhận lại ${totalReturned.toLocaleString('vi-VN')} xu (lời +${netChange.toLocaleString('vi-VN')})`;
    toast('Thắng '+netChange.toLocaleString('vi-VN')+' xu! 🎉');
  } else if(totalReturned > 0){
    resultText.textContent = `Huề vốn, nhận lại ${totalReturned.toLocaleString('vi-VN')} xu`;
  } else {
    resultText.textContent = `😢 Không trúng ô nào. Mất ${totalPlaced.toLocaleString('vi-VN')} xu`;
    toast('Không trúng, chúc bạn may mắn lần sau!');
  }

  bets = {};
  saveState();
  updateHeader();
  renderBetAmounts();

  isShaking = false;
  shakeBtn.disabled = false;
}

/* ============== EVENTS ============== */
shakeBtn.addEventListener('click', doShake);
document.getElementById('clearBetBtn').addEventListener('click', clearBets);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(isShaking) return;
  if(!confirm('Chơi lại từ đầu với 100 xu?')) return;
  state = getDefaultState();
  bets = {};
  history = [];
  historyRow.innerHTML = '';
  saveState();
  updateHeader();
  renderBetAmounts();
  clearWinMarks();
  resultText.textContent = 'Đặt cược rồi bấm Lắc Xúc Xắc!';
});

/* ============== INIT ============== */
renderBoard();
renderChips();
updateHeader();
renderBetAmounts();

})();

function goBack(){
  window.location.href = '/cauca';
}
</script>
</body>
</html>
